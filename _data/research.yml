# The three research questions on the homepage.
# `papers` point at publication ids in _data/publications.yml.
- label: Representation
  question: >-
    Given factored state variables and a causal graph, what model of transition mechanisms
    can an agent learn from its own actions, revise locally when only some mechanisms change,
    and reuse across environments, tasks and policies?
  papers:
    - { id: nbn2026, label: "arXiv 2026 · Neural Bayesian Networks" }
    - { id: neuripsw2026-nbn, label: "NeurIPS-W 2026 · Continual world models" }
    - { id: prima2024, label: "PRIMA 2024 · Causal models for RL agents" }

- label: Decision-making
  question: >-
    How should such models enter planning, policy optimisation and value estimation? And,
    in ongoing work at Oxford, how can the uncertainty of a learned model be carried into
    the decisions made with it, so that we can say how far those decisions can be trusted?
  papers:
    - { id: percomw2026, label: "PerCom-W 2026 · Causal value estimation" }
    - { id: area2025, label: "AREA @ ECAI 2025 · Safe multi-robot policies" }

- label: Multi-agent
  question: >-
    How can causality-driven RL extend to multi-agent settings, where cooperation and
    competition add new layers of interdependence?
  papers:
    - { id: roadmap2025, label: "arXiv 2025 · A roadmap for causal MARL" }
    - { id: claramas2026, label: "CLaRAMAS 2026 · Goals, issues and taxonomy" }
    - { id: aamas2026-gnn, label: "AAMAS 2026 · Epistemic planning with GNNs" }
